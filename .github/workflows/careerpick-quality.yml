name: CareerPick quality checks

on:
  pull_request:
    paths:
      - 'alio.py'
      - 'qnet.py'
      - 'history.py'
      - 'monitor.py'
      - 'update.py'
      - 'sitegen.py'
      - 'scripts/build_sitemap.py'
      - 'index.html'
      - 'scripts/build_job_pages.py'
      - 'scripts/audit_site.py'
      - 'scripts/check_api_freshness.py'
      - 'scripts/test_api_freshness.py'
      - 'scripts/audit_org_links.py'
      - '.github/workflows/careerpick-quality.yml'
      - '.github/workflows/update.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile alio.py qnet.py history.py monitor.py update.py sitegen.py scripts/build_sitemap.py scripts/audit_site.py scripts/build_job_pages.py scripts/check_api_freshness.py scripts/test_api_freshness.py scripts/audit_org_links.py
      - name: Test API freshness checker
        run: python scripts/test_api_freshness.py
      - name: Run read-only site audit
        run: python scripts/audit_site.py
      - name: Audit organization links
        run: python scripts/audit_org_links.py
      - name: Run static job-page regression checks
        run: python scripts/build_job_pages.py --self-test
