name: CareerPick quality checks

on:
  pull_request:
    paths:
      - 'alio.py'
      - 'orgs.py'
      - 'test_alio_partial_fetch.py'
      - 'qnet.py'
      - 'scripts/test_qnet_pagination.py'
      - 'scripts/test_api_transport.py'
      - 'history.py'
      - 'monitor.py'
      - 'update.py'
      - 'sitegen.py'
      - 'scripts/build_sitemap.py'
      - 'index.html'
      - 'scripts/build_job_pages.py'
      - 'scripts/threads_auto.py'
      - 'scripts/audit_site.py'
      - 'scripts/check_api_freshness.py'
      - 'scripts/test_api_freshness.py'
      - 'scripts/audit_org_links.py'
      - 'scripts/summarize_api_run.py'
      - 'scripts/test_summarize_api_run.py'
      - 'scripts/test_audit_org_links.py'
      - 'scripts/test_org_page_links.py'
      - 'scripts/refresh_org_links.py'
      - '.github/workflows/careerpick-quality.yml'
      - '.github/workflows/threads_auto.yml'
      - '.github/workflows/update.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Threads image readiness guard
        run: |
          python - <<'PY'
          from pathlib import Path
          content = Path('.github/workflows/threads_auto.yml').read_text(encoding='utf-8')
          for required in ('ready = False', 'ready = True', 'if not ready:', 'Public recruitment image unavailable; skip Threads publish'):
              assert required in content, f'Missing readiness guard: {required}'
          print('Threads image readiness guard PASS')
          PY
      - name: Check Threads pending reservation safety
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('scripts/threads_auto.py').read_text(encoding='utf-8')
          assert 'manual reconciliation required before another publish attempt' in src
          assert "waiting[0]['run_id'] = run_id" not in src
          print('Unresolved Threads reservations cannot be automatically retried')
          PY
      - name: Check Python syntax
        run: python -m py_compile scripts/test_api_transport.py scripts/test_qnet_pagination.py orgs.py alio.py qnet.py history.py monitor.py update.py sitegen.py scripts/build_sitemap.py scripts/audit_site.py scripts/build_job_pages.py scripts/check_api_freshness.py scripts/test_api_freshness.py scripts/audit_org_links.py scripts/test_audit_org_links.py scripts/test_org_page_links.py scripts/refresh_org_links.py scripts/summarize_api_run.py scripts/test_summarize_api_run.py test_alio_partial_fetch.py
      - name: Test API HTTPS and credential redaction
        run: python scripts/test_api_transport.py
      - name: Test QNet pagination protection
        run: python scripts/test_qnet_pagination.py
      - name: Test ALIO partial fetch protection
        run: python test_alio_partial_fetch.py
      - name: Test API run classification
        run: python scripts/test_summarize_api_run.py
      - name: Test organization link auditor
        run: python scripts/test_audit_org_links.py
      - name: Test generated organization job links
        run: python scripts/test_org_page_links.py
      - name: Test API freshness checker
        run: python scripts/test_api_freshness.py
      - name: Run read-only site audit
        run: python scripts/audit_site.py
      - name: Audit organization links (existing generated-link issues are advisory)
        continue-on-error: true
        run: python scripts/audit_org_links.py
      - name: Run static job-page regression checks
        run: python scripts/build_job_pages.py --self-test
