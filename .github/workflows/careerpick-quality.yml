name: CareerPick quality checks

on:
  pull_request:
    paths:
      - 'alio.py'
      - 'orgs.py'
      - 'test_alio_partial_fetch.py'
      - 'qnet.py'
      - 'scripts/test_qnet_pagination.py'
      - 'history.py'
      - 'monitor.py'
      - 'update.py'
      - 'sitegen.py'
      - 'scripts/build_sitemap.py'
      - 'index.html'
      - 'scripts/build_job_pages.py'
      - 'scripts/audit_site.py'
      - 'scripts/check_api_freshness.py'
      - 'scripts/test_api_freshness.py'
      - 'scripts/audit_org_links.py'
      - 'scripts/summarize_api_run.py'
      - 'scripts/test_summarize_api_run.py'
      - 'scripts/test_audit_org_links.py'
      - 'scripts/test_org_page_links.py'
      - 'scripts/refresh_org_links.py'
      - '.github/workflows/careerpick-quality.yml'
      - '.github/workflows/update.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile scripts/test_qnet_pagination.py orgs.py alio.py qnet.py history.py monitor.py update.py sitegen.py scripts/build_sitemap.py scripts/audit_site.py scripts/build_job_pages.py scripts/check_api_freshness.py scripts/test_api_freshness.py scripts/audit_org_links.py scripts/test_audit_org_links.py scripts/test_org_page_links.py scripts/refresh_org_links.py scripts/summarize_api_run.py scripts/test_summarize_api_run.py test_alio_partial_fetch.py
      - name: Test QNet pagination protection
        run: python scripts/test_qnet_pagination.py
      - name: Test ALIO partial fetch protection
        run: python test_alio_partial_fetch.py
      - name: Test API run classification
        run: python scripts/test_summarize_api_run.py
      - name: Test organization link auditor
        run: python scripts/test_audit_org_links.py
      - name: Test generated organization job links
        run: python scripts/test_org_page_links.py
      - name: Test API freshness checker
        run: python scripts/test_api_freshness.py
      - name: Run read-only site audit
        run: python scripts/audit_site.py
      - name: Audit organization links (existing generated-link issues are advisory)
        continue-on-error: true
        run: python scripts/audit_org_links.py
      - name: Run static job-page regression checks
        run: python scripts/build_job_pages.py --self-test
