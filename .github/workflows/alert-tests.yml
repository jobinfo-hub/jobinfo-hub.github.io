name: CareerPick alert safety tests
on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/alert-tests.yml'
  pull_request:
    paths:
      - 'scripts/*alert*.py'
      - 'scripts/*push*.py'
      - 'scripts/*onesignal*.py'
      - 'scripts/persist_accepted_push.py'
      - 'scripts/record_accepted_push.py'
      - 'tests/test_alert*.py'
      - '.github/workflows/alert-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careerpick-alert-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Run offline alert regression suite
        run: python3 -m unittest discover -s tests -p 'test_alert*.py' -v
      - name: Run offline targeted alert smoke test
        run: python3 -m scripts.smoke_targeted_alerts
