name: CareerPick alert safety tests
on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/alert-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/alert-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careerpick-alert-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Run offline alert regression suite
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -p 'test_alert*.py' -v 2>&1 | tee alert-regression.log
      - name: Run offline targeted alert smoke test
        if: success()
        run: python3 -m scripts.smoke_targeted_alerts
      - name: Verify schema-v4 delivery pipeline without sending
        if: success()
        run: python3 -m scripts.smoke_alert_delivery_v4
      - name: Attach test failure details
        if: failure()
        shell: bash
        run: |
          {
            echo '## CareerPick alert regression failure'
            echo 'Open the regression step above for the Python traceback.'
            echo 'The full regression log is also attached as a downloadable artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: careerpick-alert-regression-log
          path: alert-regression.log
          if-no-files-found: ignore
          retention-days: 7
