name: Prepare Naver blog drafts (review only)
on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *" # 09:20 KST daily, after upstream ALIO refresh
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document and image tools
        run: |
          python -m pip install "python-docx>=1.1,<2" "Pillow>=10,<13"
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
      - name: Check draft generator
        run: python -m unittest discover -s tests -p 'test_naver_drafts.py'
      - name: Generate drafts
        run: python scripts/generate_naver_drafts.py
      - name: Build DOCX and image review packs
        run: python scripts/build_naver_review_packs.py
      - name: Upload review drafts
        uses: actions/upload-artifact@v4
        with:
          name: naver-blog-review-drafts
          path: |
            naver-drafts/
            naver-review-packs/
          retention-days: 14
