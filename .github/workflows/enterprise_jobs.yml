
name: 대기업 채용 자동 수집

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enterprise-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect enterprise jobs
        env:
          SARAMIN_API_KEY: ${{ secrets.SARAMIN_API_KEY }}
        run: python scripts/collect_enterprise.py

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add enterprise_jobs.json enterprise_status.json

          if git diff --cached --quiet; then
            echo "변경된 데이터가 없습니다."
            exit 0
          fi

          git commit -m "Update enterprise job data"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "데이터 저장 완료"
              exit 0
            fi

            echo "저장 충돌 발생 - 재시도 $attempt"
            git fetch origin main
            git rebase origin/main || exit 1
            sleep 5
          done

          echo "3회 재시도 후에도 저장하지 못했습니다."
          exit 1
