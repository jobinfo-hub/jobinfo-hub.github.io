
name: 대기업 채용 자동 수집

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enterprise-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect enterprise jobs
        env:
          SARAMIN_API_KEY: ${{ secrets.SARAMIN_API_KEY }}
        run: python scripts/collect_enterprise.py

      - name: Commit data changes
        run: |
          git add enterprise_jobs.json enterprise_status.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update enterprise job data"
            git push
          fi
