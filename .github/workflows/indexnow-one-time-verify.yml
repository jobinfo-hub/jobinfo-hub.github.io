name: CareerPick one-time IndexNow verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/indexnow-one-time-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify public ownership key is deployed
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from scripts.submit_indexnow import KEY, KEY_LOCATION
          with urlopen(KEY_LOCATION, timeout=20) as response:
              actual = response.read().decode('utf-8').strip()
          assert actual == KEY, 'Public IndexNow ownership key mismatch'
          print('Public IndexNow ownership key verified')
          PY
      - name: Submit up to 100 existing job URLs to IndexNow
        run: python scripts/submit_indexnow.py --bootstrap
