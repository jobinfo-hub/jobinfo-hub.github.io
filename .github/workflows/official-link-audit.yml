name: CareerPick official link audit
on:
  schedule:
    # Mondays 02:17 UTC (11:17 KST); small rotating read-only sample
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      sample_size:
        description: 'Number of ALIO links to check (1-50)'
        required: true
        default: '20'
        type: choice
        options: ['10', '20', '50']
  pull_request:
    paths:
      - 'scripts/audit_official_links.py'
      - '.github/workflows/official-link-audit.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile audit script
        run: python -m py_compile scripts/audit_official_links.py
      - name: Run offline audit regression checks
        run: python scripts/audit_official_links.py --self-test
      - name: Run bounded read-only URL audit
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          SAMPLE_SIZE: ${{ github.event_name == 'schedule' && '20' || inputs.sample_size }}
          AUDIT_MODE: ${{ github.event_name }}
        run: |
          if [ "$AUDIT_MODE" = 'schedule' ]; then
            python scripts/audit_official_links.py --limit "$SAMPLE_SIZE" --rotate-weekly
          else
            python scripts/audit_official_links.py --limit "$SAMPLE_SIZE"
          fi
      - name: Show Korean audit summary
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: cat link-audit-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic report
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: careerpick-official-link-audit
          path: |
            link-audit-results.json
            link-audit-summary.md
          retention-days: 7
