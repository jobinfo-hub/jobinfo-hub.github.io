
name: Check Threads User ID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-id:
    runs-on: ubuntu-latest

    steps:
      - name: Compare Threads account IDs
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import urllib.error

          token = os.environ.get("THREADS_ACCESS_TOKEN", "")
          configured_id = os.environ.get("THREADS_USER_ID", "")

          if not token:
              raise SystemExit("THREADS_ACCESS_TOKEN missing")

          if not configured_id:
              raise SystemExit("THREADS_USER_ID missing")

          url = "https://graph.threads.net/v1.0/me"
          url += "?" + urllib.parse.urlencode({
              "fields": "id,username"
          })

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  account = json.load(response)
          except urllib.error.HTTPError as exc:
              print("Account API HTTP error:", exc.code)
              raise SystemExit(1) from None

          actual_id = str(account.get("id", ""))
          username = account.get("username", "")

          print("=== CareerPick Threads ID Diagnosis ===")
          print("Username:", username)
          print("API account ID:", actual_id)
          print("Configured ID length:", len(configured_id))
          print("API ID length:", len(actual_id))
          print("Exact match:", actual_id == configured_id)
          print("Trimmed match:", actual_id == configured_id.strip())

          if actual_id == configured_id:
              print("RESULT: MATCH")
          elif actual_id == configured_id.strip():
              print("RESULT: WHITESPACE ISSUE")
          else:
              print("RESULT: ID MISMATCH")
              print("Configured ID differs from API account ID")

          print("No Threads posts were created")
          PY
