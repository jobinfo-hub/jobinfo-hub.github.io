
name: CareerPick Threads Auto

on:
  schedule:
    # UTC -> KST 09:00, 11:15, 13:30, 15:45, 18:00
    - cron: '0 0 * * *'
    - cron: '15 2 * * *'
    - cron: '30 4 * * *'
    - cron: '45 6 * * *'
    - cron: '0 9 * * *'

  workflow_dispatch:
    inputs:
      test_publish:
        description: '실제 Threads 게시 1건 테스트'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: careerpick-threads-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    env:
      TZ: Asia/Seoul
      THREADS_ENABLED: ${{ vars.THREADS_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.test_publish == true) }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check files
        run: |
          test -f alio.json
          test -f scripts/threads_auto.py
          test -f threads_posted.json

      - name: Preview (disabled mode)
        if: env.THREADS_ENABLED != 'true'
        run: python scripts/threads_auto.py preview

      - name: Validate publishing credentials
        if: env.THREADS_ENABLED == 'true'
        run: |
          test -n "$THREADS_ACCESS_TOKEN"
          test -n "$THREADS_USER_ID"

      - name: Reserve one job
        if: env.THREADS_ENABLED == 'true'
        run: python scripts/threads_auto.py prepare

      - name: Install Korean fonts and Pillow
        if: env.THREADS_ENABLED == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install 'Pillow>=10,<13'

      - name: Generate recruitment image
        if: env.THREADS_ENABLED == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.create_thumbnail import generate
          history = json.loads(Path('threads_posted.json').read_text(encoding='utf-8'))
          matches = [r for r in history.get('records', []) if r.get('run_id') == __import__('os').environ['GITHUB_RUN_ID'] and r.get('status') == 'pending']
          if len(matches) == 1 and matches[0].get('image_job'):
              print('Generated image:', generate(matches[0]['image_job']))
          PY

      - name: Persist reservation before publishing
        if: env.THREADS_ENABLED == 'true'
        run: |
          if [ -n "$(git status --porcelain -- threads_posted.json threads-images/)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add threads_posted.json threads-images/
            git commit -m 'Reserve CareerPick Threads job'
            git push
          fi

      - name: Reload persisted reservation
        if: env.THREADS_ENABLED == 'true'
        run: |
          git fetch origin main
          git restore --source=origin/main -- threads_posted.json

      - name: Trigger Pages deployment for newly committed image
        if: env.THREADS_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN pushes do not trigger the usual push workflows.
          # Explicitly dispatch Pages after the image has been committed.
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          records = json.loads(Path('threads_posted.json').read_text(encoding='utf-8')).get('records', [])
          pending = [r for r in records if r.get('run_id') == os.environ['GITHUB_RUN_ID'] and r.get('status') == 'pending']
          if len(pending) != 1 or not pending[0].get('image_url'):
              print('No pending image to deploy')
          else:
              repo = os.environ['GITHUB_REPOSITORY']
              url = f'https://api.github.com/repos/{repo}/actions/workflows/deploy.yml/dispatches'
              request = urllib.request.Request(
                  url, data=json.dumps({'ref': 'main'}).encode(),
                  method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json'
                  }
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 204:
                      raise RuntimeError(f'Pages deployment dispatch returned {response.status}')
              print('Requested Pages deployment for pending image')
          PY

      - name: Allow Pages deployment to serve new image
        if: env.THREADS_ENABLED == 'true'
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          records = json.loads(Path('threads_posted.json').read_text(encoding='utf-8')).get('records', [])
          pending = [r for r in records if r.get('run_id') == os.environ['GITHUB_RUN_ID'] and r.get('status') == 'pending']
          if len(pending) == 1:
              url = pending[0].get('image_url')
              if url:
                  ready = False
                  for _ in range(60):
                      try:
                          with urllib.request.urlopen(urllib.request.Request(url, method='HEAD'), timeout=10) as response:
                              if response.status == 200 and response.headers.get('Content-Type', '').startswith('image/'):
                                  print('Public image ready')
                                  ready = True
                                  break
                      except Exception as exc:
                          print('Waiting for public image:', type(exc).__name__)
                      time.sleep(10)
                  if not ready:
                      raise SystemExit('Public recruitment image unavailable; skip Threads publish')
          PY

      - name: Validate image readiness guard
        if: env.THREADS_ENABLED == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/threads_auto.yml').read_text(encoding='utf-8')
          assert "ready = False" in workflow
          assert "ready = True" in workflow
          assert "if not ready:" in workflow
          assert "raise SystemExit('Public recruitment image unavailable; skip Threads publish')" in workflow
          print('Threads image readiness guard present')
          PY

      - name: Publish one Threads post
        if: env.THREADS_ENABLED == 'true'
        run: python scripts/threads_auto.py publish

      - name: Persist successful publish
        if: env.THREADS_ENABLED == 'true'
        run: |
          if [ -n "$(git status --porcelain -- threads_posted.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add threads_posted.json
            git commit -m 'Record published CareerPick Threads job'
            git push
          fi
