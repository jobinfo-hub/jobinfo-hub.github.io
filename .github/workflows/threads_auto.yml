
name: CareerPick Threads Auto

on:
  schedule:
    # GitHub Actions는 UTC 기준
    # 한국시간 09:00, 11:15, 13:30, 15:45, 18:00
    - cron: '0 0 * * *'
    - cron: '15 2 * * *'
    - cron: '30 4 * * *'
    - cron: '45 6 * * *'
    - cron: '0 9 * * *'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careerpick-threads-preview
  cancel-in-progress: false

jobs:
  preview:
    name: Preview CareerPick Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check required files
        run: |
          test -f alio.json
          test -f scripts/threads_auto.py

      - name: Preview selected jobs
        env:
          THREADS_ENABLED: 'false'
          TZ: Asia/Seoul
        run: |
          python scripts/threads_auto.py

      - name: Preview completed
        run: |
          echo "CareerPick preview completed."
          echo "Threads publishing is disabled."
          echo "No posts were published."
