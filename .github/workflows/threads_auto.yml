
name: CareerPick Threads Auto

on:
  schedule:
    # UTC => KST 09:00, 11:15, 13:30, 15:45, 18:00
    - cron: '0 0 * * *'
    - cron: '15 2 * * *'
    - cron: '30 4 * * *'
    - cron: '45 6 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: careerpick-threads-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: Asia/Seoul
      THREADS_ENABLED: ${{ vars.THREADS_ENABLED || 'false' }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check files
        run: |
          test -f alio.json
          test -f scripts/threads_auto.py
          test -f threads_posted.json

      - name: Preview (disabled mode)
        if: env.THREADS_ENABLED != 'true'
        run: python scripts/threads_auto.py preview

      - name: Validate publishing credentials
        if: env.THREADS_ENABLED == 'true'
        run: |
          test -n "$THREADS_ACCESS_TOKEN"
          test -n "$THREADS_USER_ID"

      - name: Reserve one job
        if: env.THREADS_ENABLED == 'true'
        run: python scripts/threads_auto.py prepare

      - name: Persist reservation before publishing
        if: env.THREADS_ENABLED == 'true'
        run: |
          if [ -n "$(git status --porcelain -- threads_posted.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add threads_posted.json
            git commit -m 'Reserve CareerPick Threads job'
            git push
          fi

      - name: Reload persisted reservation
        if: env.THREADS_ENABLED == 'true'
        run: |
          git fetch origin main
          git restore --source=origin/main -- threads_posted.json

      - name: Publish one Threads post
        if: env.THREADS_ENABLED == 'true'
        run: python scripts/threads_auto.py publish

      - name: Persist successful publish
        if: env.THREADS_ENABLED == 'true'
        run: |
          if [ -n "$(git status --porcelain -- threads_posted.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add threads_posted.json
            git commit -m 'Record published CareerPick Threads job'
            git push
          fi
