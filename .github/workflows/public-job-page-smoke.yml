name: CareerPick public job page smoke
on:
  pull_request:
    paths:
      - '.github/workflows/public-job-page-smoke.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-job-page-smoke.yml'
  workflow_run:
    workflows: ['CareerPick rebuild static job pages']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '13 3 * * *'
jobs:
  check-public-pages:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate public smoke check inputs on PR
        if: github.event_name == 'pull_request'
        run: |
          python scripts/build_job_pages.py --self-test
          python - <<'PY'
          from pathlib import Path
          assert Path('jobs/a306139.html').exists()
          print('Public smoke workflow PR validation: PASS')
          PY
      - name: Check published job HTML and fallback link
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import URLError, HTTPError
          from scripts.build_job_pages import safe_url
          data = json.loads(Path('alio.json').read_text(encoding='utf-8'))
          candidates = [p for p in data.get('posts', []) if isinstance(p, dict)
              and p.get('alio') and safe_url(p.get('src')) and safe_url(p.get('url'))
              and safe_url(p.get('src')) != safe_url(p.get('url'))]
          if not candidates:
              print('No eligible distinct official/ALIO URLs; skip')
              raise SystemExit(0)
          target = next((p for p in candidates if Path('jobs', str(p.get('id')) + '.html').exists()), None)
          if target is None:
              raise SystemExit('No generated candidate HTML found')
          from urllib.parse import quote
          url = 'https://jobinfo-hub.github.io/jobs/' + quote(str(target['id']), safe='') + '.html'
          # GitHub Pages publication may lag behind the generator commit.
          if __import__('os').environ.get('GITHUB_EVENT_NAME') == 'workflow_run':
              print('Waiting 90 seconds for Pages publication')
              time.sleep(90)
          last_error = None
          for attempt in range(5):
              try:
                  with urlopen(Request(url, headers={'User-Agent':'CareerPick-PublicSmoke/1.0'}), timeout=15) as response:
                      html = response.read(300000).decode('utf-8', errors='replace')
                  if 'ALIO 원본에서 공고 확인' not in html:
                      raise RuntimeError('Public page missing ALIO fallback link')
                  print('Public page contains ALIO fallback:', url)
                  break
              except (URLError, HTTPError, TimeoutError, RuntimeError) as exc:
                  last_error = exc
                  print(f'Attempt {attempt + 1}/5 failed: {type(exc).__name__}: {exc}')
                  if attempt < 4:
                      time.sleep(30)
          else:
              raise SystemExit(f'Public deployment check failed for {url}: {last_error}')
          # Also verify the updated official-link help on the published ALIO example.
          guidance_url = 'https://jobinfo-hub.github.io/jobs/a306101.html'
          for attempt in range(5):
              try:
                  with urlopen(Request(guidance_url, headers={'User-Agent':'CareerPick-PublicSmoke/1.0'}), timeout=15) as response:
                      guidance_html = response.read(300000).decode('utf-8', errors='replace')
                  if '실시간 접속 상태를 보증하지 않습니다' not in guidance_html:
                      raise RuntimeError('Published page missing new official-link guidance')
                  if 'ALIO 원본에서 공고 확인' not in guidance_html:
                      raise RuntimeError('Published page missing ALIO fallback')
                  print('Public page contains updated official-link guidance:', guidance_url)
                  break
              except (URLError, HTTPError, TimeoutError, RuntimeError) as exc:
                  print(f'Guidance check attempt {attempt + 1}/5: {type(exc).__name__}: {exc}')
                  if attempt < 4:
                      time.sleep(30)
          else:
              raise SystemExit('Updated official-link guidance is not yet publicly served')
          PY

      - name: Verify published sitemap and robots discovery
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import time
          import xml.etree.ElementTree as ET
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          base = 'https://jobinfo-hub.github.io'
          expected = {base + '/jobs/a306101.html', base + '/jobs/a306139.html'}
          for attempt in range(5):
              try:
                  with urlopen(Request(base + '/robots.txt', headers={'User-Agent':'CareerPick-PublicSmoke/1.0'}), timeout=15) as response:
                      robots = response.read(20000).decode('utf-8', errors='replace')
                  assert 'Sitemap: ' + base + '/sitemap.xml' in robots, 'robots.txt missing sitemap declaration'
                  with urlopen(Request(base + '/sitemap.xml', headers={'User-Agent':'CareerPick-PublicSmoke/1.0'}), timeout=15) as response:
                      xml_bytes = response.read(5000000)
                  root = ET.fromstring(xml_bytes)
                  ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
                  urls = [e.text.strip() for e in root.findall('s:url/s:loc', ns) if e.text]
                  assert len(urls) == len(set(urls)), 'Published sitemap has duplicate URLs'
                  assert expected.issubset(set(urls)), 'Published sitemap missing known job URLs'
                  print(f'Public sitemap PASS: {len(urls)} URLs, both job URLs present, robots discovery valid')
                  break
              except (URLError, HTTPError, TimeoutError, ET.ParseError, AssertionError) as exc:
                  print(f'Public sitemap attempt {attempt + 1}/5: {type(exc).__name__}: {exc}')
                  if attempt < 4:
                      time.sleep(30)
          else:
              raise SystemExit('Public sitemap or robots.txt verification failed')
          PY
