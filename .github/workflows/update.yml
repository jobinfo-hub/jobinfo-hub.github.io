
name: 블로그 글 자동 업데이트

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: careerpick-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 블로그 RSS 읽어서 글 목록 갱신
        run: python update.py

      - name: 잡알리오 공식 공고 가져오기
        env:
          ALIO_KEY: ${{ secrets.ALIO_KEY }}
        run: python alio.py

      - name: 기관 공식 채용공고 자동 모니터링
        run: python monitor.py

      - name: 변경된 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- . \
            ':(exclude)__pycache__' \
            ':(exclude)**/__pycache__/**' \
            ':(exclude)*.pyc' \
            ':(exclude)**/*.pyc'

          if git diff --cached --quiet; then
            echo "변경된 데이터가 없습니다."
          else
            git commit -m "채용정보 자동 업데이트"
            git push origin HEAD:main
          fi
