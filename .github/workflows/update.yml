
name: 블로그 글 자동 업데이트

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: careerpick-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 블로그 RSS 읽어서 글 목록 갱신
        run: python update.py

      - name: 잡알리오 공식 공고 가져오기
        env:
          ALIO_KEY: ${{ secrets.ALIO_KEY }}
        run: python alio.py

      - name: 기관 공식 채용공고 자동 모니터링
        run: python monitor.py

      - name: 상세페이지 생성 프로그램 확인
        run: |
          test -f scripts/build_job_pages.py
          test -f scripts/build_sitemap.py
          python -m py_compile scripts/build_job_pages.py
          python -m py_compile scripts/build_sitemap.py

      - name: 채용공고 상세페이지 자동 생성
        run: python scripts/build_job_pages.py

      - name: 사이트맵 자동 생성
        run: python scripts/build_sitemap.py

      - name: 생성 결과 검증
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          pages = list(Path("jobs").glob("a[0-9]*.html"))
          assert pages, "생성된 채용공고 상세페이지가 없습니다."

          # 모든 ALIO 상세페이지가 최신 정보 확인 안내를 포함하는지 검증합니다.
          required = (
              '/guides/recruitment-corrections-guide.html',
              '실제 담당업무는 어디서 확인하나요?',
          )
          import json
          import re
          posts = json.loads(Path("alio.json").read_text(encoding="utf-8")).get("posts", [])
          active_ids = {
              str(post.get("id", "")).strip()
              for post in posts
              if isinstance(post, dict) and post.get("alio")
              and re.fullmatch(r"a[0-9]+", str(post.get("id", "")).strip())
          }
          assert active_ids, "검증할 현재 ALIO 공고가 없습니다."
          for pid in active_ids:
              page = Path("jobs") / f"{pid}.html"
              assert page.exists(), f"현재 공고 상세페이지 누락: {page}"
              html = page.read_text(encoding="utf-8")
              for marker in required:
                  assert marker in html, (
                      f"{page}: 필수 안내 누락: {marker}"
                  )

          root = ET.parse("sitemap.xml").getroot()
          ns = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}

          urls = [
              e.text for e in root.findall(".//s:loc", ns)
              if e.text
          ]

          job_urls = [
              u for u in urls
              if u.startswith(
                  "https://jobinfo-hub.github.io/jobs/"
              )
          ]

          assert len(urls) == len(set(urls)), "중복 URL 발견"
          assert len(job_urls) == len(pages), (
              "상세페이지 수와 사이트맵 URL 수가 다릅니다."
          )

          print("상세페이지:", len(pages))
          print("사이트맵 전체 URL:", len(urls))
          print("사이트맵 채용 URL:", len(job_urls))
          print("검증 성공")
          PY

      - name: 변경된 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- . \
            ':(exclude)__pycache__' \
            ':(exclude)**/__pycache__/**' \
            ':(exclude)*.pyc' \
            ':(exclude)**/*.pyc'

          if git diff --cached --quiet; then
            echo "변경된 데이터가 없습니다."
          else
            git commit -m "채용정보 상세페이지 및 사이트맵 자동 업데이트"
            git push origin HEAD:main
          fi
