
name: 블로그 글 자동 업데이트

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: careerpick-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 블로그 RSS 읽어서 글 목록 갱신
        run: python update.py

      - name: ALIO API 인증 설정 확인 (값 비공개)
        env:
          ALIO_KEY: ${{ secrets.ALIO_KEY }}
        shell: bash
        run: |
          if [ -z "$ALIO_KEY" ]; then
            echo '::warning title=ALIO_KEY 미설정::ALIO와 큐넷 API 갱신이 건너뛰어질 수 있습니다. GitHub Actions secrets 설정을 확인하세요.'
            echo '⚠️ ALIO_KEY가 설정되지 않았습니다. API 갱신이 건너뛰어질 수 있습니다.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ALIO_KEY 설정 존재 여부 확인 완료 (인증값 미출력).'
          fi

      - name: 잡알리오 공식 공고 가져오기
        env:
          ALIO_KEY: ${{ secrets.ALIO_KEY }}
        run: |
          python alio.py 2>&1 | tee /tmp/careerpick-api-run.log
          exit ${PIPESTATUS[0]}

      - name: API 호출 결과 분류 및 실행 요약
        if: always()
        shell: bash
        run: |
          python scripts/summarize_api_run.py /tmp/careerpick-api-run.log >> "$GITHUB_STEP_SUMMARY" || echo "⚠️ API 실행 결과 요약을 생성하지 못했습니다." >> "$GITHUB_STEP_SUMMARY"

      - name: 기관 공식 채용공고 자동 모니터링
        run: python monitor.py

      - name: 상세페이지 생성 프로그램 확인
        run: |
          test -f scripts/build_job_pages.py
          test -f scripts/build_sitemap.py
          python -m py_compile scripts/build_job_pages.py
          python -m py_compile scripts/build_sitemap.py

      - name: 채용공고 상세페이지 자동 생성
        run: python scripts/build_job_pages.py

      - name: 사이트맵 자동 생성
        run: python scripts/build_sitemap.py

      - name: 생성 결과 검증
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          pages = list(Path("jobs").glob("a[0-9]*.html"))
          assert pages, "생성된 채용공고 상세페이지가 없습니다."

          # 모든 ALIO 상세페이지가 최신 정보 확인 안내를 포함하는지 검증합니다.
          required = (
              '/guides/recruitment-corrections-guide.html',
              '실제 담당업무는 어디서 확인하나요?',
          )
          import json
          import re
          posts = json.loads(Path("alio.json").read_text(encoding="utf-8")).get("posts", [])
          active_ids = {
              str(post.get("id", "")).strip()
              for post in posts
              if isinstance(post, dict) and post.get("alio")
              and re.fullmatch(r"a[0-9]+", str(post.get("id", "")).strip())
          }
          assert active_ids, "검증할 현재 ALIO 공고가 없습니다."
          for pid in active_ids:
              page = Path("jobs") / f"{pid}.html"
              assert page.exists(), f"현재 공고 상세페이지 누락: {page}"
              html = page.read_text(encoding="utf-8")
              for marker in required:
                  assert marker in html, (
                      f"{page}: 필수 안내 누락: {marker}"
                  )

          root = ET.parse("sitemap.xml").getroot()
          ns = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}

          urls = [
              e.text for e in root.findall(".//s:loc", ns)
              if e.text
          ]

          job_urls = [
              u for u in urls
              if u.startswith(
                  "https://jobinfo-hub.github.io/jobs/"
              )
          ]

          assert len(urls) == len(set(urls)), "중복 URL 발견"
          assert len(job_urls) == len(pages), (
              "상세페이지 수와 사이트맵 URL 수가 다릅니다."
          )

          print("상세페이지:", len(pages))
          print("사이트맵 전체 URL:", len(urls))
          print("사이트맵 채용 URL:", len(job_urls))
          print("검증 성공")
          PY

      - name: 기관별 채용 상세링크 검사 (경고 전용)
        id: org_links
        continue-on-error: true
        run: python scripts/audit_org_links.py

      - name: 기관별 링크 검사 결과를 실행 요약에 기록
        if: always()
        shell: bash
        run: |
          echo '## 기관별 채용 링크 점검' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '오류가 발견되더라도 기존 정기 수집 및 사이트 배포를 중단하지 않습니다.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          python scripts/audit_org_links.py >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 기관별 채용 링크 오류 경고 표시
        if: steps.org_links.outcome == 'failure'
        run: echo '::warning title=기관별 채용 링크 오류::기관별 페이지에서 누락된 상세페이지 또는 해시 링크가 발견됐습니다. 실행 요약을 확인하세요.'

      - name: ALIO·큐넷 데이터 최신성 검사 (경고 전용)
        id: api_freshness
        continue-on-error: true
        run: python scripts/check_api_freshness.py

      - name: API 데이터 상태를 실행 요약에 기록
        if: always()
        shell: bash
        run: |
          echo '## ALIO·큐넷 데이터 상태' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '아래 검사는 로컬 JSON 스냅샷 기준이며 실제 API 호출 성공을 보증하지 않습니다.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          python scripts/check_api_freshness.py >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 데이터 최신성 경고 표시
        if: steps.api_freshness.outcome == 'failure'
        run: echo '::warning title=API 데이터 최신성 확인 필요::ALIO 또는 큐넷 데이터가 오래되었거나 비어 있습니다. API 응답 및 수집 로그를 확인하세요.'

      - name: 변경된 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- . \
            ':(exclude)__pycache__' \
            ':(exclude)**/__pycache__/**' \
            ':(exclude)*.pyc' \
            ':(exclude)**/*.pyc'

          if git diff --cached --quiet; then
            echo "변경된 데이터가 없습니다."
          else
            git commit -m "채용정보 상세페이지 및 사이트맵 자동 업데이트"
            git push origin HEAD:main
          fi
