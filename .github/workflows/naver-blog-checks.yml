name: Validate Naver draft generator
on:
  pull_request:
    paths:
      - 'scripts/generate_naver_drafts.py'
      - 'scripts/build_naver_review_packs.py'
      - 'tests/test_naver_drafts.py'
      - '.github/workflows/naver-blog-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install "python-docx>=1.1,<2" "Pillow>=10,<13"
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
      - name: Compile and test
        run: |
          python -m compileall -q scripts/generate_naver_drafts.py scripts/build_naver_review_packs.py
          python -m unittest discover -s tests -p 'test_naver_drafts.py'
      - name: Generate review package
        run: |
          python scripts/generate_naver_drafts.py
          python scripts/build_naver_review_packs.py
      - name: Verify outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('naver-drafts/manifest.json').read_text(encoding='utf-8'))
          assert len(m)<=11
          for item in m:
              i=item['id']
              assert Path(f'naver-review-packs/{i}.docx').is_file()
              assert Path(f'naver-review-packs/{i}-thumbnail.png').is_file()
              assert item['status']=='needs_review'
          print('Verified',len(m),'draft packs')
          PY
