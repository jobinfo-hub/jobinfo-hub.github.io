name: CareerPick Work24 recruitment ingestion
on:
  workflow_dispatch:
  schedule:
    - cron: '18 0,6 * * *'
permissions:
  contents: write
concurrency:
  group: careerpick-work24-ingestion
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      WORK24_RECRUITMENT_KEY: ${{ secrets.WORK24_RECRUITMENT_KEY }}
      WORK24_COMMON_KEY: ${{ secrets.WORK24_COMMON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Work24 XML parser offline
        run: python -m unittest scripts.test_fetch_work24
      - name: Fetch Work24 listings (skip until secret configured)
        if: env.WORK24_RECRUITMENT_KEY != ''
        env:
          WORK24_RECRUITMENT_KEY: ${{ secrets.WORK24_RECRUITMENT_KEY }}
          WORK24_COMMON_KEY: ${{ secrets.WORK24_COMMON_KEY }}
        run: python scripts/fetch_work24.py
      - name: Commit independent Work24 data
        if: env.WORK24_RECRUITMENT_KEY != ''
        env:
          WORK24_RECRUITMENT_KEY: ${{ secrets.WORK24_RECRUITMENT_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f work24.json
          if [ -f work24-codes.json ]; then git add -f work24-codes.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Work24 recruitment listings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
