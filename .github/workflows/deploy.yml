
name: 커리어픽 홈페이지 배포

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5

      - name: 홈페이지 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: 홈페이지 배포
        id: deployment
        uses: actions/deploy-pages@v4
