name: CareerPick rebuild static job pages
on:
  workflow_dispatch:
  schedule:
    - cron: '43 1 * * *'
  pull_request:
    paths:
      - 'scripts/build_job_pages.py'
      - 'scripts/audit_generated_job_schema.py'
      - 'scripts/test_audit_generated_job_schema.py'
      - 'scripts/fix_org_job_links.py'
      - 'scripts/annotate_org_source_window.py'
      - 'scripts/audit_org_deadlines.py'
      - 'scripts/audit_org_alio_coverage.py'
      - 'scripts/test_org_alias_normalization.py'
      - 'scripts/sync_org_alio_list.py'
      - 'scripts/test_sync_org_alio_list.py'
      - 'scripts/check_live_org_pages.py'
      - 'scripts/test_check_live_org_pages.py'
      - 'scripts/mark_expired_org_jobs.py'
      - 'scripts/test_mark_expired_org_jobs.py'
      - '.github/workflows/rebuild-job-pages.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build_job_pages.py'
      - 'scripts/audit_generated_job_schema.py'
      - 'scripts/test_audit_generated_job_schema.py'
      - 'scripts/fix_org_job_links.py'
      - 'scripts/annotate_org_source_window.py'
      - 'scripts/audit_org_deadlines.py'
      - 'scripts/audit_org_alio_coverage.py'
      - 'scripts/test_org_alias_normalization.py'
      - 'scripts/sync_org_alio_list.py'
      - 'scripts/test_sync_org_alio_list.py'
      - 'scripts/check_live_org_pages.py'
      - 'scripts/test_check_live_org_pages.py'
      - 'scripts/mark_expired_org_jobs.py'
      - 'scripts/test_mark_expired_org_jobs.py'
      - '.github/workflows/rebuild-job-pages.yml'
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: careerpick-job-page-rebuild
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test live Pages smoke-check behavior offline
        run: python scripts/test_check_live_org_pages.py
      - name: Test institution name alias normalization
        run: python scripts/test_org_alias_normalization.py
      - name: Test institution ALIO listing refresh offline
        run: python scripts/test_sync_org_alio_list.py
      - name: Run offline generator regression checks
        run: python scripts/build_job_pages.py --self-test
      - name: Test generated JobPosting audit offline
        run: python scripts/test_audit_generated_job_schema.py
      - name: Regenerate job pages from committed ALIO data
        run: python scripts/build_job_pages.py
      - name: Audit all generated JobPosting metadata
        run: python scripts/audit_generated_job_schema.py
      - name: Refresh complete institution ALIO listings
        run: python scripts/sync_org_alio_list.py
      - name: Repair institution links to existing job pages
        run: python scripts/fix_org_job_links.py
      - name: Explain institution ALIO source date ranges
        run: python scripts/annotate_org_source_window.py
      - name: Test institution expired-deadline labeling
        run: python scripts/test_mark_expired_org_jobs.py
      - name: Mark institution listings past stored deadlines
        run: python scripts/mark_expired_org_jobs.py
      - name: Audit institution ALIO active listing coverage
        run: python scripts/audit_org_alio_coverage.py
      - name: Audit institution recruitment deadlines
        run: python scripts/audit_org_deadlines.py
      - name: Update sitemap from generated job pages
        run: python scripts/build_sitemap.py
      - name: Validate sitemap job URL integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          import xml.etree.ElementTree as ET
          root = ET.parse('sitemap.xml').getroot()
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [e.text.strip() for e in root.findall('s:url/s:loc', ns) if e.text]
          assert len(urls) == len(set(urls)), 'Duplicate sitemap URLs'
          assert all(urlsplit(u).scheme == 'https' and urlsplit(u).netloc == 'jobinfo-hub.github.io' for u in urls), 'Unexpected sitemap host or scheme'
          listed = {unquote(urlsplit(u).path).removeprefix('/') for u in urls if urlsplit(u).path.startswith('/jobs/')}
          generated = {p.as_posix() for p in Path('jobs').glob('a[0-9]*.html') if p.stem[1:].isdigit()}
          assert listed == generated, f'Sitemap job mismatch: missing={sorted(generated-listed)[:5]} stale={sorted(listed-generated)[:5]}'
          from urllib.parse import quote
          other_urls = [u for u in urls if not urlsplit(u).path.startswith('/jobs/')]
          missing = []
          for url in other_urls:
              path = unquote(urlsplit(url).path).lstrip('/')
              file_path = Path(path, 'index.html') if not path or path.endswith('/') else Path(path)
              if not file_path.is_file():
                  missing.append(url)
          assert not missing, f'Sitemap URLs without local HTML files: {missing[:10]}'
          print(f'Sitemap integrity PASS: {len(urls)} URLs, {len(listed)} job pages, {len(other_urls)} non-job files, no duplicates')
          PY
      - name: Verify ALIO fallback in a generated page
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.build_job_pages import safe_url
          posts = json.loads(Path('alio.json').read_text(encoding='utf-8')).get('posts', [])
          candidates = [
              p for p in posts
              if isinstance(p, dict) and p.get('alio')
              and safe_url(p.get('src')) and safe_url(p.get('url'))
              and safe_url(p.get('src')) != safe_url(p.get('url'))
          ]
          if not candidates:
              print('No ALIO fallback candidates in current data')
          else:
              p = next((x for x in candidates if Path('jobs', x['id'] + '.html').exists()), None)
              if p is None:
                  raise SystemExit('Expected generated page not found')
              page = Path('jobs', p['id'] + '.html').read_text(encoding='utf-8')
              assert 'ALIO 원본에서 공고 확인' in page, p['id']
              print('Verified ALIO fallback in', p['id'])
          PY
      - name: Commit generated HTML only when changed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/ job-quality-report.json sitemap.xml org-*.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: refresh static ALIO job pages"
            git push
          fi

  deploy-generated-pages:
    needs: rebuild
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public institution ALIO list after deployment
        run: python scripts/check_live_org_pages.py
