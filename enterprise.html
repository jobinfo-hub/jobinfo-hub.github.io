<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="커리어픽 대기업 채용공고. 승인된 데이터 출처의 공고를 확인하세요."><title>대기업 채용 | 커리어픽</title><style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#1c2940;font:15px/1.6 system-ui,-apple-system,'Noto Sans KR',sans-serif}main{max-width:1020px;margin:auto;padding:20px 15px 70px}header{background:#fff;border-bottom:1px solid #dde4ef}header>div{max-width:1020px;margin:auto;padding:15px}a{color:#2549b8;text-decoration:none}h1{margin:12px 0 3px;font-size:28px}p{margin:5px 0 15px}.muted{color:#62708a}.box{background:white;border:1px solid #dce3ed;border-radius:14px;padding:17px;margin:16px 0}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}input,select{min-width:0;width:100%;padding:12px;border:1px solid #b9c5d7;border-radius:9px;font:inherit}.stat{display:flex;flex-wrap:wrap;gap:10px}.stat span{padding:10px 15px;background:#eef3ff;border-radius:9px}.job{border-top:1px solid #e5eaf1;padding:16px 0}.job h3{margin:0;font-size:17px}.job p{margin:5px 0}.tag{display:inline-block;padding:1px 7px;background:#eef3ff;border-radius:6px;color:#2443a1;font-size:12px}.empty{text-align:center;padding:28px 10px;color:#5c6b81}button{border:0;background:#2445b4;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}@media(max-width:650px){.filters{grid-template-columns:1fr}h1{font-size:23px}}</style></head><body><header><div><a href="index.html">← 커리어픽 홈</a>　<a href="prep.html">취업 준비실</a></div></header><main><h1>🏢 대기업 채용</h1><p class="muted">기업별 신입·경력·인턴 채용공고를 모아 봅니다. 공고의 정확한 조건은 공식 채용 페이지에서 확인하세요.</p><section class="box"><div class="stat"><span>진행 중 <strong id="active">—</strong></span><span>24시간 신규 <strong id="fresh">—</strong></span><span>7일 내 마감 <strong id="soon">—</strong></span></div><p id="updated" class="muted" role="status">데이터 확인 중…</p></section><section class="box"><div class="filters"><input id="q" type="search" placeholder="기업명·공고명 검색" aria-label="공고 검색"><select id="group" aria-label="기업 그룹"><option value="">전체 기업</option></select><select id="career" aria-label="채용 유형"><option value="">전체 유형</option><option>신입</option><option>경력</option><option>인턴</option></select></div><div id="results" aria-live="polite"></div></section></main><script>
'use strict';let jobs=[];const $=id=>document.getElementById(id);const fmt=x=>x?new Date(x).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}):'아직 없음';function el(tag,cls,txt){let e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function dt(v){if(!v)return null;let d=new Date(v);return Number.isNaN(+d)?null:d}function render(){let now=Date.now(),q=$('q').value.trim().toLowerCase(),g=$('group').value,c=$('career').value;let active=jobs.filter(j=>!j.deadline||dt(j.deadline)&&+dt(j.deadline)>=now);$('active').textContent=active.length;$('fresh').textContent=jobs.filter(j=>dt(j.first_seen_at)&&now-(+dt(j.first_seen_at))<=86400000&&now>=+dt(j.first_seen_at)).length;$('soon').textContent=active.filter(j=>dt(j.deadline)&&+dt(j.deadline)-now<=604800000).length;let selected=active.filter(j=>(!q||(j.company+' '+j.title).toLowerCase().includes(q))&&(!g||j.group===g)&&(!c||(j.career||'').includes(c)));let out=$('results');out.replaceChildren();if(!selected.length){out.append(el('div','empty',jobs.length?'조건에 맞는 진행 중 공고가 없습니다.':'현재 게시된 대기업 공고가 없습니다. API 승인 및 연결 후 표시됩니다.'));return}for(let j of selected){let a=el('article','job'),h=el('h3'),link=el('a','',j.title);link.href=j.url;link.target='_blank';link.rel='noopener noreferrer';h.append(link);a.append(h,el('p','',j.company+' · '+(j.career||'유형 확인 필요')+' · '+(j.location||'근무지 확인 필요')),el('p','muted','마감: '+(j.deadline||'원문 확인')+' · 출처: '+j.source));out.append(a)}}async function init(){try{let r=await fetch('enterprise_jobs.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let data=await r.json();if(!Array.isArray(data.jobs))throw Error('잘못된 데이터 형식');jobs=data.jobs.filter(j=>j&&typeof j.title==='string'&&typeof j.company==='string'&&typeof j.url==='string'&&/^https:\/\//.test(j.url));$('updated').textContent='데이터 갱신: '+fmt(data.updated_at)+(data.updated_at?'':' · API 승인 대기 중');let groups=[...new Set(jobs.map(j=>j.group).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));for(let name of groups){let opt=el('option','',name);opt.value=name;$('group').append(opt)}render()}catch(e){$('updated').textContent='채용 데이터 로드 실패 — 잠시 후 다시 확인해 주세요.';$('results').append(el('div','empty','데이터를 불러올 수 없습니다.'));}}['q','group','career'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));init();
</script></body></html>
