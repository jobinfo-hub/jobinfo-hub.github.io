<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>취업/정책 지원소 · 공고 모아보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6475; --line:#DFE4EE;
  --brand:#1F3FBF; --brand-soft:#E6EBFB; --hot:#E0312F; --hot-soft:#FDE8E7;
  --open:#0E7C7B; --open-soft:#E1F3F2; --closed:#9AA3B2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1524; --surface:#172036; --ink:#E8ECF5; --muted:#9AA6BD; --line:#2A3550;
    --brand:#7C95FF; --brand-soft:#212C4D; --hot:#FF6B66; --hot-soft:#3A1F27;
    --open:#4CC4C1; --open-soft:#15333A; --closed:#5E6880;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1524; --surface:#172036; --ink:#E8ECF5; --muted:#9AA6BD; --line:#2A3550;
  --brand:#7C95FF; --brand-soft:#212C4D; --hot:#FF6B66; --hot-soft:#3A1F27;
  --open:#4CC4C1; --open-soft:#15333A; --closed:#5E6880;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
header{padding:28px 0 18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:"Black Han Sans",sans-serif;font-size:15px;line-height:1.05;text-align:center;flex:none}
h1{margin:0;font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:28px;letter-spacing:-.5px;line-height:1.15}
.tagline{margin:12px 0 4px;font-size:17px;font-weight:600}
.updated{font-size:13px;color:var(--muted)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:12px 10px;white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer}
.tab .n{font-weight:500;font-size:13px;margin-left:3px}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.toggle{width:100%;margin:14px 0 0;padding:12px;border:2px solid var(--hot);border-radius:12px;background:var(--surface);color:var(--hot);font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.panel{display:none;margin-top:10px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel.open{display:block}
.panel label.h{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
.panel label.h:first-child{margin-top:0}
input[type=search]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.reset{margin-top:14px;appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:0}
.summary{margin:16px 2px 8px;font-size:14px;color:var(--muted)}
.summary b{color:var(--ink)}
.summary .hot{color:var(--hot);font-weight:700}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item a{display:flex;gap:14px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none}
.item a:hover{border-color:var(--brand)}
.item a:focus-visible,.tab:focus-visible,.chip:focus-visible,.toggle:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.dd{flex:none;width:64px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0;text-align:center}
.dd .big{font-family:"Black Han Sans",sans-serif;font-size:24px;line-height:1}
.dd .sm{font-size:11px;margin-top:4px;font-weight:600}
.dd.open{background:var(--open-soft);color:var(--open)}
.dd.hot{background:var(--hot-soft);color:var(--hot)}
.dd.closed{background:var(--bg);color:var(--closed)}
.dd.info{background:var(--brand-soft);color:var(--brand)}
.dd.info .big{font-size:15px;line-height:1.2}
.body{min-width:0;flex:1}
.cat{display:inline-block;font-size:12px;font-weight:600;color:var(--brand);margin-bottom:2px}
.title{margin:0;font-size:16px;font-weight:700;line-height:1.4;word-break:keep-all}
.desc{margin:4px 0 6px;font-size:14px;color:var(--muted);word-break:keep-all}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.meta .due{color:var(--ink);font-weight:600}
.item.is-closed .title{color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.empty button{margin-top:10px}
.ad{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ad-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.ad-head b{font-size:14px}
.ad-tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.ad-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ad-grid a{color:inherit;text-decoration:none;min-width:0}
.ad-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--bg);display:block}
.ad-name{font-size:12px;line-height:1.35;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ad-price{font-size:13px;font-weight:700;margin-top:2px}
.ad-rocket{color:var(--brand);font-size:11px;font-weight:600}
.ad-note{font-size:11px;color:var(--muted);margin:8px 0 0}
.promo{position:relative}
.promo a{display:block;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.promo img{display:block;width:100%;height:auto;aspect-ratio:3/2}
.promo .ad-tag{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.92);color:#5B6475;border-color:transparent}
.promo .ad-note{margin:6px 2px 0}
.ad-slot{display:none}
footer{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}
footer a{color:inherit}
@media (prefers-reduced-motion:no-preference){.panel.open{animation:drop .18s ease-out}@keyframes drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">취업<br>정책</div>
      <h1>취업/정책 지원소</h1>
    </div>
    <p class="tagline">놓치면 끝나는 공채·공무직·정책 정보, 마감순으로 한눈에</p>
    <div class="updated" id="updated"></div>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>

  <button class="toggle" id="toggle" aria-expanded="false" aria-controls="panel">☰ 검색·필터</button>
  <div class="panel" id="panel">
    <label class="h" for="q">검색</label>
    <input type="search" id="q" placeholder="기관명, 직무, 키워드 (예: 인턴, 간호사, 공무직)">
    <label class="h">빠른 키워드</label>
    <div class="chips" id="quick"></div>
    <label class="h">분야</label>
    <div class="chips" id="cats"></div>
    <label class="h">모집 상태</label>
    <div class="chips" id="status"></div>
    <label class="h">정렬</label>
    <div class="chips" id="sort"></div>
    <button class="reset" id="reset">필터 초기화</button>
  </div>

  <p class="summary" id="summary"></p>

  <!-- 쿠팡 파트너스 등 배너를 넣으려면 아래 div의 class에서 ad-slot을 지우고 코드를 붙여넣으세요 -->
  <div class="ad-slot" id="ad-top"></div>

  <ul class="list" id="list"></ul>

  <footer>
    글을 누르면 네이버 블로그 원문으로 이동합니다.<br>
    <a href="https://m.blog.naver.com/hid4989-3" target="_blank" rel="noopener">블로그 바로가기</a>
  </footer>
</div>

<script>
let POSTS = [], UPDATED = null, ADS = [];
const pad = n => String(n).padStart(2,"0");
const kst = d => new Date(d.getTime() + 9*3600e3);
function dueText(d, hasTime){
  const k = kst(d);
  return `${k.getUTCMonth()+1}.${k.getUTCDate()}` + (hasTime ? ` ${pad(k.getUTCHours())}:${pad(k.getUTCMinutes())}` : "");
}
async function load(){
  try{
    const r = await fetch("posts.json?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    UPDATED = j.updated;
    POSTS = j.posts.map(p => {
      const due = p.due ? new Date(p.due) : null;
      return {...p, pub:new Date(p.pub), due, dueText: due ? dueText(due, p.dueHasTime) : ""};
    });
  }catch(e){
    $("list").innerHTML = '<li class="empty">글 목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</li>';
    return;
  }
  const k = kst(new Date(UPDATED));
  $("updated").textContent = `${k.getUTCFullYear()}.${pad(k.getUTCMonth()+1)}.${pad(k.getUTCDate())} ${pad(k.getUTCHours())}:${pad(k.getUTCMinutes())} 업데이트, 글 ${POSTS.length}개`;
  refresh();
  try{
    const a = await fetch("ads.json?t=" + Date.now(), {cache:"no-store"});
    if(a.ok){ ADS = ((await a.json()).products || []).sort(() => Math.random() - .5); render(); }
  }catch(e){}
}

const PROMO = {
  url: "https://bitl.bz/zdoDny",
  images: [
    {src: "banner1.webp", alt: "취업·이직 준비, 혼자 하지 마세요. 자기소개서·이력서·인적성·NCS필기·면접 컨설팅, 크몽에서 상담하기"},
    {src: "banner2.webp", alt: "취업·이직, 혼자 준비하지 마세요. 자격증·자소서·면접·커리어 컨설팅, 크몽에서 전문가 찾기"}
  ],
  note: "이 배너는 제휴 링크로, 이를 통해 구매가 이루어지면 일정액의 수수료를 제공받습니다."
};
const PROMO_PICK = PROMO.images[Math.floor(Math.random() * PROMO.images.length)];
function promoBlock(){
  return `<li class="promo"><a href="${PROMO.url}" target="_blank" rel="sponsored noopener">
    <img src="${PROMO_PICK.src}" alt="${esc(PROMO_PICK.alt)}" width="1200" height="800" loading="lazy"></a>
    <span class="ad-tag">광고</span><p class="ad-note">${PROMO.note}</p></li>`;
}
const DISCLOSURE = "이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.";
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function adBlock(n){
  const picks = ADS.slice(n*3, n*3 + 3);
  if(picks.length < 3) return "";
  return `<li class="ad"><div class="ad-head"><b>취업 준비에 필요한 것</b><span class="ad-tag">광고</span></div>
    <div class="ad-grid">${picks.map(p => `<a href="${esc(p.url)}" target="_blank" rel="sponsored noopener">
      <img src="${esc(p.image)}" alt="" loading="lazy">
      <div class="ad-name">${esc(p.name)}</div>
      <div class="ad-price">${p.price ? Number(p.price).toLocaleString("ko-KR") + "원" : ""}</div>
      ${p.rocket ? '<div class="ad-rocket">로켓배송</div>' : ""}</a>`).join("")}</div>
    <p class="ad-note">${DISCLOSURE}</p></li>`;
}

const TABS = [
  {key:"all", label:"전체"},
  {key:"j", label:"채용공고"},
  {key:"p", label:"취업준비"},
  {key:"m", label:"정책·재테크"}
];
const QUICK = ["인턴","공무직","정규직","간호","병원","연구직","경력","필기 없음"];
const STATUS = [["all","전체"],["open","모집 중"],["hot","마감 임박"],["closed","마감"]];
const SORTS = [["new","최신순"],["due","마감 가까운 순"]];

const state = {tab:"all", q:"", cat:null, status:"all", sort:"new"};
const $ = id => document.getElementById(id);
const fmt = d => { const k = kst(d); return `${k.getUTCMonth()+1}.${k.getUTCDate()}`; };

function kstDay(d){ const k = new Date(d.getTime() + 9*3600e3); return Date.UTC(k.getUTCFullYear(), k.getUTCMonth(), k.getUTCDate()); }
function dday(p, now){
  if(!p.due) return null;
  if(now > p.due) return {cls:"closed", big:"마감", n:Infinity};
  const n = Math.round((kstDay(p.due) - kstDay(now)) / 864e5);
  return {cls: n <= 3 ? "hot" : "open", big: n === 0 ? "D-DAY" : `D-${n}`, n};
}
function statusOf(p, now){
  const d = dday(p, now);
  if(!d) return "none";
  if(d.cls === "closed") return "closed";
  return d.cls === "hot" ? "hot" : "open";
}

function renderTabs(){
  $("tabs").innerHTML = TABS.map(t => {
    const n = t.key === "all" ? POSTS.length : POSTS.filter(p => p.type === t.key).length;
    return `<button class="tab" role="tab" data-tab="${t.key}" aria-selected="${state.tab===t.key}">${t.label}<span class="n">${n}</span></button>`;
  }).join("");
}
function chipRow(el, items, current, attr){
  el.innerHTML = items.map(([v,l]) => `<button class="chip" data-${attr}="${v}" aria-pressed="${current===v}">${l}</button>`).join("");
}
function renderFilters(){
  const inTab = POSTS.filter(p => state.tab === "all" || p.type === state.tab);
  const cats = [...new Set(inTab.map(p => p.cat))];
  if(state.cat && !cats.includes(state.cat)) state.cat = null;
  chipRow($("cats"), [["","전체"], ...cats.map(c => [c,c])], state.cat || "", "cat");
  chipRow($("quick"), QUICK.map(k => [k,k]), state.q, "quick");
  chipRow($("status"), STATUS, state.status, "status");
  chipRow($("sort"), SORTS, state.sort, "sort");
}

function render(){
  const now = new Date();
  const q = state.q.trim().toLowerCase();
  let rows = POSTS.filter(p =>
    (state.tab === "all" || p.type === state.tab) &&
    (!state.cat || p.cat === state.cat) &&
    (!q || (p.title + " " + p.desc + " " + p.cat).toLowerCase().includes(q))
  );
  if(state.status !== "all") rows = rows.filter(p => statusOf(p, now) === state.status);
  if(state.sort === "due"){
    rows.sort((a,b) => {
      const da = dday(a,now), db = dday(b,now);
      return (da ? da.n : 1e9) - (db ? db.n : 1e9) || b.pub - a.pub;
    });
  } else rows.sort((a,b) => b.pub - a.pub);

  const jobs = rows.filter(p => p.due);
  const open = jobs.filter(p => statusOf(p,now) !== "closed").length;
  const hot = jobs.filter(p => statusOf(p,now) === "hot").length;
  $("summary").innerHTML = `글 <b>${rows.length}</b>개 / 모집 중인 공고 <b>${open}</b>건` + (hot ? ` (마감 임박 <span class="hot">${hot}</span>건)` : "");

  if(!rows.length){
    $("list").innerHTML = `<li class="empty">조건에 맞는 글이 없습니다. 검색어나 필터를 바꿔 보세요.<br><button class="chip" id="empty-reset">필터 초기화</button></li>`;
    return;
  }
  const cards = rows.map(p => {
    const d = dday(p, now);
    const tile = d
      ? `<div class="dd ${d.cls}"><span class="big">${d.big}</span><span class="sm">${d.cls==="closed" ? fmt(p.due) : "마감 " + fmt(p.due)}</span></div>`
      : `<div class="dd info"><span class="big">${p.type==="p" ? "취업<br>준비" : "정책<br>정보"}</span></div>`;
    return `<li class="item ${d && d.cls==="closed" ? "is-closed" : ""}">
      <a href="${p.url}" target="_blank" rel="noopener">
        ${tile}
        <div class="body">
          <span class="cat">${p.cat}</span>
          <h2 class="title">${p.title}</h2>
          <p class="desc">${p.desc}</p>
          <div class="meta">${p.due ? `<span class="due">접수 마감 ${p.dueText}</span>` : ""}<span>${fmt(p.pub)} 게시</span></div>
        </div>
      </a></li>`;
  });
  const n = cards.length;
  if(ADS.length){
    cards.push(adBlock(1));
    if(n > 10) cards.splice(10, 0, adBlock(0));
  }
  cards.splice(Math.min(3, n), 0, promoBlock());
  $("list").innerHTML = cards.join("");
}
function refresh(){ renderTabs(); renderFilters(); render(); }



document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if(!t) return;
  if(t.dataset.tab){ state.tab = t.dataset.tab; refresh(); }
  else if(t.dataset.cat !== undefined){ state.cat = t.dataset.cat || null; refresh(); }
  else if(t.dataset.quick){ state.q = state.q === t.dataset.quick ? "" : t.dataset.quick; $("q").value = state.q; refresh(); }
  else if(t.dataset.status){ state.status = t.dataset.status; refresh(); }
  else if(t.dataset.sort){ state.sort = t.dataset.sort; refresh(); }
  else if(t.id === "toggle"){ const o = $("panel").classList.toggle("open"); t.setAttribute("aria-expanded", o); }
  else if(t.id === "reset" || t.id === "empty-reset"){ Object.assign(state,{q:"",cat:null,status:"all",sort:"new"}); $("q").value=""; refresh(); }
});
$("q").addEventListener("input", e => { state.q = e.target.value; renderFilters(); render(); });

load();
setInterval(() => POSTS.length && render(), 60000);
</script>
</body>
</html>
